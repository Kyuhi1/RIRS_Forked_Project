name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Linting and code formatting checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: |
          npm ci
          npm run lint
        working-directory: frontend
      - run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
        working-directory: backend

  # Build frontend and backend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: cargo build --release -p api
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: backend-api
          path: backend/target/release/api

  # Running tests for frontend and backend
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: popravi
          POSTGRES_PASSWORD: popravi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U popravi"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://popravi:popravi@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          npm ci
          npx vitest run --coverage
        working-directory: frontend
      - run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --html
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/llvm-cov/html

  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: actions/download-artifact@v4
        with:
          name: backend-api
          path: backend-api
      - name: Deploy frontend (Vercel)
        run: |
          mkdir -p .vercel/output/static
          cp -r frontend-dist/. .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json
          npx --yes vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Push backend image (GHCR)
        run: |
          chmod +x backend-api/api
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f backend/Dockerfile.deploy -t ghcr.io/kyuhi1/popravi-api:latest backend-api
          docker push ghcr.io/kyuhi1/popravi-api:latest
      - name: Redeploy backend (Render)
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
